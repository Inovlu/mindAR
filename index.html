    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./targets/targets.mind; filterMinCF: 0.0001; filterBeta: 1000;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="abigail_bernandez" src="assets/Abigail_Bernardez_optimizado.glb"></a-asset-item>

        <a-asset-item id="francisco_rizzo" src="assets/Fran_Rizzo_optimizado.glb"></a-asset-item>
        <a-asset-item id="julieta_ascona" src="assets/Ascona_Juli_optimizado.glb"></a-asset-item>
        <a-asset-item id="luca_violi" src="assets/Violi_Luca_optimizado.glb"></a-asset-item>
        <a-asset-item id="maite_rodriguez" src="assets/Maite_Rodriguez_optimizado.glb"></a-asset-item>
        <a-asset-item id="melody_ramos" src="assets/Ramos_Melody_optimizado.glb"></a-asset-item>
        <a-asset-item id="pedro_mamciz" src="assets/Mamciz_Pedro_optimizado.glb"></a-asset-item>
        <a-asset-item id="roque_casarrella" src="assets/Roque_Casarella_optimizado.glb"></a-asset-item>

      <a-entity mindar-image-target="targetIndex: 0">
