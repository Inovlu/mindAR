<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://aframe.io" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preload" href="./targets/targets.mind" as="fetch" crossorigin />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      #capture-button {
        position: fixed;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 10000;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 4px solid #ffffff;
        background: rgba(255, 255, 255, 0.35);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      #capture-button:active {
        background: rgba(255, 255, 255, 0.8);
      }
      #capture-button:disabled {
        opacity: 0.5;
      }
      #torch-button {
        position: fixed;
        right: 24px;
        bottom: calc(36px + env(safe-area-inset-bottom));
        z-index: 10000;
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        padding: 0;
        border: 2px solid #ffffff;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      #torch-button[aria-pressed="true"] {
        background: #ffffff;
        color: #111111;
      }
      #torch-button:disabled {
        border-color: rgba(255, 255, 255, 0.45);
        background: rgba(100, 100, 100, 0.45);
        color: rgba(255, 255, 255, 0.45);
        box-shadow: none;
        cursor: not-allowed;
        opacity: 0.75;
      }
      #capture-flash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #ffffff;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease-out;
      }
      #capture-flash.active {
        opacity: 0.8;
        transition: none;
      }
      #photo-preview {
        position: fixed;
        inset: 0;
        z-index: 10001;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.92);
        color: #ffffff;
        font-family: sans-serif;
      }
      #photo-preview[hidden] {
        display: none;
      }
      #photo-preview-image {
        display: block;
        max-width: 100%;
        max-height: calc(100% - 100px);
        object-fit: contain;
      }
      #photo-preview-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      #photo-preview-actions button {
        min-height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 24px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #save-photo-button {
        background: #ffffff;
        color: #111111;
      }
      #discard-photo-button {
        background: #444444;
        color: #ffffff;
      }
      #photo-preview-actions button:disabled {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <button id="capture-button" type="button" aria-label="Sacar foto"></button>
    <button id="torch-button" type="button" aria-label="Flash de cámara no disponible" aria-pressed="false" disabled>
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M13 2 4.5 13h6L9.5 22 19.5 9h-6L13 2z" />
      </svg>
    </button>
    <div id="capture-flash"></div>
    <section id="photo-preview" role="dialog" aria-modal="true" aria-label="Vista previa de la foto" hidden>
      <img id="photo-preview-image" alt="Vista previa de la fotografía" />
      <div id="photo-preview-actions">
        <button id="save-photo-button" type="button">Guardar en galería</button>
        <button id="discard-photo-button" type="button">Descartar</button>
      </div>
    </section>
    <a-scene mindar-image="imageTargetSrc: ./targets/targets.mind; filterMinCF: 0.0001; filterBeta: 10; warmupTolerance: 3; missTolerance: 1;" color-space="sRGB" renderer="colorManagement: true; antialias: false" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 1">
      </a-entity>

      </a-entity>

      </a-entity>
      <a-entity mindar-image-target="targetIndex: 4">
      </a-entity>

      </a-entity>
      <a-entity mindar-image-target="targetIndex: 6">
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 7">
      </a-entity>

      </a-entity>
      <a-entity mindar-image-target="targetIndex: 9">
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 10">
      </a-entity>

    </a-scene>
    <script>
      (() => {
        const MAX_CACHED_MODELS = 3;
        const MAX_PIXEL_RATIO = 2;
        const params = new URLSearchParams(location.search);
        const MODEL_DIR = 'assets_opt_v003';
        // Test-only: append ?lightMaterial to replace the GLB's PBR material with Lambert.
        const USE_LIGHT_MATERIAL = params.has('lightMaterial');
        console.info(`[GLB LRU] Using models from ${MODEL_DIR}/, ${USE_LIGHT_MATERIAL ? 'light' : 'original'} material`);
        const modelPaths = [
          'Abigail_Bernardez_optimizado.glb',
          'Agustin_Pina_optimizado.glb',
          'Sadran_Agustin_optimizados.glb',
          'Agustina_Lopez_optimizado.glb',
          'Amy_Lindo_optimizado.glb',
          'Ariadna_Robles_optimizado.glb',
          'Cami_Casolati_optimizado.glb',
          'Roman_Brucoli_optimizado.glb',
          'Piputto_Facundo_optimizado.glb',
          'Fede_Pracias_optimizado.glb',
          'Fran_Rizzo_optimizado.glb',
          'Ascona_Juli_optimizado.glb',
          'Violi_Luca_optimizado.glb',
          'Maite_Rodriguez_optimizado.glb',
          'Ramos_Melody_optimizado.glb',
          'Mamciz_Pedro_optimizado.glb',
          'Roque_Casarella_optimizado.glb',
          'Francisco_Silva_optimizado.glb',
          'Irina_Silva_optimizado.glb',
          'Sofi_Cravero_optimizado.glb',
          'Virna_Vianello_optimizado.glb'
        ].map((file) => `${MODEL_DIR}/${file}`);

        const scene = document.querySelector('a-scene');
        // Append ?stats to show A-Frame's FPS/triangles overlay.
        if (params.has('stats')) scene.setAttribute('stats', '');
        // Append ?metrics to log load and frame metrics; inspect them with arMetrics.summary() in the console.
        const metrics = createMetrics(params.has('metrics'));

        function createMetrics(enabled) {
          const noop = () => {};
          if (!enabled) return { found: noop, loadStart: noop, loaded: noop, visible: noop, lost: noop };

          const FRAME_WINDOW_MS = 5000;
          const round = (value) => Math.round(value * 10) / 10;
          const kb = (bytes) => (bytes ? Math.round(bytes / 1024) : null);
          const resourceEntry = (url) => performance.getEntriesByName(url, 'resource').at(-1);
          const heapMB = () => (performance.memory ? round(performance.memory.usedJSHeapSize / 1048576) : null);

          const data = {
            config: {
              modelDir: MODEL_DIR,
              material: USE_LIGHT_MATERIAL ? 'light' : 'original',
              devicePixelRatio: window.devicePixelRatio,
              maxPixelRatio: MAX_PIXEL_RATIO,
              userAgent: navigator.userAgent
            },
            startup: {},
            models: [],
            frames: []
          };
          const foundAt = new Map();
          const loadStartAt = new Map();
          const visibleTargets = new Set();

          if (performance.setResourceTimingBufferSize) performance.setResourceTimingBufferSize(500);

          if (!scene.hasLoaded) {
            scene.addEventListener('loaded', () => {
              data.startup.sceneLoadedMs = Math.round(performance.now());
            }, { once: true });
          }

          scene.addEventListener('arReady', () => {
            const mind = resourceEntry(new URL('./targets/targets.mind', document.baseURI).href);
            Object.assign(data.startup, {
              arReadyMs: Math.round(performance.now()),
              mindDownloadMs: mind ? Math.round(mind.responseEnd - mind.startTime) : null,
              mindTransferKB: mind ? kb(mind.transferSize) : null,
              mindEncodedKB: mind ? kb(mind.encodedBodySize) : null,
              mindDecodedKB: mind ? kb(mind.decodedBodySize) : null,
              heapMB: heapMB()
            });
            console.info('[Metrics] Startup', data.startup);
          }, { once: true });

          let windowStart = performance.now();
          let lastFrame = windowStart;
          let deltas = [];
          function onFrame(now) {
            deltas.push(now - lastFrame);
            lastFrame = now;
            if (now - windowStart >= FRAME_WINDOW_MS) {
              const sorted = deltas.slice().sort((a, b) => a - b);
              const pick = (p) => sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * p))];
              const info = scene.renderer ? scene.renderer.info : null;
              const sample = {
                atMs: Math.round(now),
                visibleTargets: [...visibleTargets].join(',') || '-',
                fps: round(deltas.length / ((now - windowStart) / 1000)),
                frameP50Ms: round(pick(0.5)),
                frameP95Ms: round(pick(0.95)),
                frameMaxMs: round(sorted[sorted.length - 1]),
                triangles: info ? info.render.triangles : null,
                drawCalls: info ? info.render.calls : null,
                geometries: info ? info.memory.geometries : null,
                heapMB: heapMB()
              };
              data.frames.push(sample);
              console.info('[Metrics] Frames', sample);
              windowStart = now;
              deltas = [];
            }
            requestAnimationFrame(onFrame);
          }
          requestAnimationFrame(onFrame);

          window.arMetrics = {
            data,
            summary() {
              const withModel = data.frames.filter((f) => f.visibleTargets !== '-');
              const avg = (key) => (withModel.length ? round(withModel.reduce((s, f) => s + f[key], 0) / withModel.length) : null);
              const misses = data.models.filter((m) => !m.cacheHit);
              const avgMiss = (key) => (misses.length ? Math.round(misses.reduce((s, m) => s + (m[key] || 0), 0) / misses.length) : null);
              console.info('[Metrics] Config', data.config);
              console.info('[Metrics] Startup', data.startup);
              console.table(data.models);
              console.table(data.frames);
              const overview = {
                avgFoundToVisibleMs: avgMiss('foundToVisibleMs'),
                avgDownloadMs: avgMiss('downloadMs'),
                avgDecodeMs: avgMiss('decodeMs'),
                avgFpsWithModel: avg('fps'),
                avgFrameP50MsWithModel: avg('frameP50Ms'),
                avgFrameP95MsWithModel: avg('frameP95Ms'),
                maxHeapMB: Math.max(...data.frames.map((f) => f.heapMB || 0)) || null
              };
              console.info('[Metrics] Overview (cache misses / frames with a model visible)', overview);
              return overview;
            },
            export() {
              return JSON.stringify(data, null, 2);
            }
          };
          console.info('[Metrics] Enabled. Run arMetrics.summary() or copy(arMetrics.export()) in the console.');

          return {
            found(index) {
              if (!foundAt.has(index)) foundAt.set(index, performance.now());
            },
            loadStart(index) {
              loadStartAt.set(index, performance.now());
            },
            loaded(index, url) {
              const now = performance.now();
              const entry = resourceEntry(url);
              const record = {
                target: index,
                file: url.split('/').pop(),
                cacheHit: false,
                loadMs: Math.round(now - loadStartAt.get(index)),
                downloadMs: entry ? Math.round(entry.responseEnd - entry.startTime) : null,
                decodeMs: entry ? Math.round(now - entry.responseEnd) : null,
                transferKB: entry ? kb(entry.transferSize) : null,
                foundToVisibleMs: null,
                heapMB: heapMB()
              };
              loadStartAt.delete(index);
              data.models.push(record);
              console.info('[Metrics] Model loaded', record);
            },
            visible(index, cacheHit) {
              visibleTargets.add(index);
              const start = foundAt.get(index);
              if (start === undefined) return;
              foundAt.delete(index);
              const foundToVisibleMs = Math.round(performance.now() - start);
              const record = [...data.models].reverse().find((m) => m.target === index && m.foundToVisibleMs === null);
              if (record && !cacheHit) record.foundToVisibleMs = foundToVisibleMs;
              else data.models.push({ target: index, file: modelPaths[index].split('/').pop(), cacheHit: true, foundToVisibleMs });
              console.info(`[Metrics] Target ${index} visible after ${foundToVisibleMs} ms${cacheHit ? ' (cache hit)' : ''}`);
            },
            lost(index) {
              visibleTargets.delete(index);
              foundAt.delete(index);
            }
          };
        }

        const cache = new Map();
        const activeTargets = new Set();
        const pendingTargets = [];
        const pendingSet = new Set();
        const spinners = new Map();
        let previewBlob = null;
        let previewUrl = null;
        let previewFileName = null;

        function setSpinner(index, anchor, show) {
          let spinner = spinners.get(index);
          if (!spinner) {
            if (!show || !anchor) return;
            spinner = document.createElement('a-ring');
            spinner.setAttribute('radius-inner', 0.08);
            spinner.setAttribute('radius-outer', 0.1);
            spinner.setAttribute('theta-length', 270);
            spinner.setAttribute('position', '0 0 0.01');
            spinner.setAttribute('material', 'shader: flat; color: #ffffff; transparent: true; opacity: 0.9');
            spinner.setAttribute('animation', 'property: rotation; from: 0 0 0; to: 0 0 -360; dur: 1000; easing: linear; loop: true');
            anchor.appendChild(spinner);
            spinners.set(index, spinner);
          }
          spinner.setAttribute('visible', show);
          spinner.setAttribute('animation', 'enabled', show);
        }

        function updateSpinner(index, anchor) {
          const entry = cache.get(index);
          setSpinner(index, anchor, activeTargets.has(index) && !(entry && entry.status === 'ready'));
        }

        function applyLightMaterial(entity) {
          const root = entity.getObject3D('mesh');
          if (!root) return;
          root.traverse((object) => {
            if (!object.isMesh) return;
            const oldMaterials = Array.isArray(object.material) ? object.material : [object.material];
            const newMaterials = oldMaterials.map((oldMaterial) => {
              const material = new THREE.MeshLambertMaterial({
                color: oldMaterial.color ? oldMaterial.color.clone() : 0xffffff,
                vertexColors: Boolean(object.geometry.attributes.color),
                side: THREE.FrontSide
              });
              oldMaterial.dispose();
              return material;
            });
            object.material = Array.isArray(object.material) ? newMaterials : newMaterials[0];
          });
        }

        function touch(index) {
          const entry = cache.get(index);
          if (!entry) return;
          cache.delete(index);
          cache.set(index, entry);
        }

        function attachToTarget(entry, cacheHit = false) {
          const anchor = entry.anchor;
          if (!anchor || !activeTargets.has(entry.index)) return;
          entry.entity.setAttribute('visible', true);
          metrics.visible(entry.index, cacheHit);
        }

        function disposeEntry(entry) {
          const entity = entry.entity;
          const root = entity.getObject3D('mesh') || entity.object3D;
          const geometries = new Set();
          const materials = new Set();
          const textures = new Set();

          if (root) {
            root.traverse((object) => {
              if (object.geometry) geometries.add(object.geometry);
              const objectMaterials = Array.isArray(object.material)
                ? object.material
                : object.material ? [object.material] : [];

              objectMaterials.forEach((material) => {
                materials.add(material);
                Object.values(material).forEach((value) => {
                  if (value && value.isTexture) textures.add(value);
                });
              });
            });
          }

          textures.forEach((texture) => texture.dispose());
          materials.forEach((material) => material.dispose());
          geometries.forEach((geometry) => geometry.dispose());
          entity.removeAttribute('gltf-model');
          if (entity.parentNode) entity.parentNode.removeChild(entity);

          if (window.THREE && THREE.Cache.enabled) {
            THREE.Cache.remove(entry.url);
          }
        }

        function evictLeastRecentlyUsedInactive() {
          for (const [index, entry] of cache) {
            if (!entry.active && entry.status === 'ready') {
              cache.delete(index);
              disposeEntry(entry);
              console.info(`[GLB LRU] Evicted target ${index}; cache ${cache.size}/${MAX_CACHED_MODELS}`);
              return true;
            }
          }
          return false;
        }

        function createEntry(index) {
          const entity = document.createElement('a-entity');
          const entry = {
            index,
            url: new URL(modelPaths[index], document.baseURI).href,
            entity,
            anchor: document.querySelector(`[mindar-image-target="targetIndex: ${index}"]`),
            status: 'loading',
            active: activeTargets.has(index)
          };

          if (!entry.anchor) {
            console.error(`[GLB LRU] No target entity found for index ${index}`);
            return;
          }

          entity.setAttribute('position', '0 0 0');
          entity.setAttribute('rotation', '90 0 0');
          entity.setAttribute('scale', '1 1 1');
          entity.setAttribute('visible', false);

          entity.addEventListener('model-loaded', () => {
            if (cache.get(index) !== entry) return;
            if (USE_LIGHT_MATERIAL) applyLightMaterial(entity);
            metrics.loaded(index, entry.url);
            entry.status = 'ready';
            updateSpinner(index, entry.anchor);
            if (entry.active && activeTargets.has(index)) attachToTarget(entry);
            console.info(`[GLB LRU] Loaded target ${index}; cache ${cache.size}/${MAX_CACHED_MODELS}`);
            processPendingTargets();
          }, { once: true });

          entity.addEventListener('model-error', (event) => {
            if (cache.get(index) !== entry) return;
            console.error(`[GLB LRU] Failed to load target ${index}`, event.detail);
            cache.delete(index);
            disposeEntry(entry);
            setSpinner(index, entry.anchor, false);
            processPendingTargets();
          }, { once: true });

          cache.set(index, entry);
          entry.anchor.appendChild(entity);
          metrics.loadStart(index);
          entity.setAttribute('gltf-model', entry.url);
          console.info(`[GLB LRU] Loading target ${index}; cache ${cache.size}/${MAX_CACHED_MODELS}`);
        }

        function processPendingTargets() {
          while (pendingTargets.length > 0) {
            const index = pendingTargets[0];
            if (!activeTargets.has(index)) {
              pendingTargets.shift();
              pendingSet.delete(index);
              continue;
            }

            if (cache.has(index)) {
              pendingTargets.shift();
              pendingSet.delete(index);
              continue;
            }

            while (cache.size >= MAX_CACHED_MODELS && evictLeastRecentlyUsedInactive()) {
              // Evict inactive ready entries until one of the three slots is free.
            }

            if (cache.size >= MAX_CACHED_MODELS) return;

            pendingTargets.shift();
            pendingSet.delete(index);
            createEntry(index);
          }
        }

        function onTargetFound(index, anchor) {
          activeTargets.delete(index);
          activeTargets.add(index);
          metrics.found(index);
          updateSpinner(index, anchor);
          const entry = cache.get(index);
          if (entry) {
            entry.active = true;
            entry.anchor = anchor;
            touch(index);
            if (entry.status === 'ready') attachToTarget(entry, true);
            console.info(`[GLB LRU] Target ${index} found; cache hit, moved to MRU`);
            return;
          }

          if (!pendingSet.has(index)) {
            pendingTargets.push(index);
            pendingSet.add(index);
          }
          processPendingTargets();
        }

        function onTargetLost(index) {
          activeTargets.delete(index);
          metrics.lost(index);
          setSpinner(index, null, false);
          if (pendingSet.has(index)) {
            pendingSet.delete(index);
            const queueIndex = pendingTargets.indexOf(index);
            if (queueIndex !== -1) pendingTargets.splice(queueIndex, 1);
          }

          const entry = cache.get(index);
          if (entry) {
            entry.active = false;
            entry.entity.setAttribute('visible', false);
            console.info(`[GLB LRU] Target ${index} lost; model retained in cache`);
          }

          processPendingTargets();
        }

        function initializeTargetEvents() {
          const gltfSystem = scene.systems['gltf-model'];
          const dracoLoader = gltfSystem && gltfSystem.getDRACOLoader();
          if (dracoLoader) dracoLoader.preload();

          if (scene.renderer && window.devicePixelRatio > MAX_PIXEL_RATIO) {
            scene.renderer.setPixelRatio(MAX_PIXEL_RATIO);
          }

          document.querySelectorAll('[mindar-image-target]').forEach((anchor) => {
            const targetConfig = anchor.getAttribute('mindar-image-target');
            const index = Number(targetConfig.targetIndex);

            if (!Number.isInteger(index) || !modelPaths[index]) {
              console.error('[GLB LRU] Missing GLB mapping for target', targetConfig.targetIndex);
              return;
            }

            anchor.addEventListener('targetFound', () => onTargetFound(index, anchor));
            anchor.addEventListener('targetLost', () => onTargetLost(index));
          });
        }

        async function capturePhoto() {
          const glCanvas = scene.canvas;
          const video = document.querySelector('video');
          const width = window.innerWidth;
          const height = window.innerHeight;
          const glRect = glCanvas.getBoundingClientRect();
          const ratio = glCanvas.width / glRect.width || 1;

          const output = document.createElement('canvas');
          output.width = Math.round(width * ratio);
          output.height = Math.round(height * ratio);
          try {
            const ctx = output.getContext('2d');
            if (!ctx) throw new Error('Could not create a 2D canvas context');
            ctx.scale(ratio, ratio);

            if (video && video.readyState >= 2) {
              const rect = video.getBoundingClientRect();
              ctx.drawImage(video, rect.left, rect.top, rect.width, rect.height);
            }

            // Re-render right before reading so the WebGL buffer isn't empty (no preserveDrawingBuffer).
            scene.renderer.render(scene.object3D, scene.camera);
            ctx.drawImage(glCanvas, glRect.left, glRect.top, glRect.width, glRect.height);

            return await new Promise((resolve, reject) => {
              output.toBlob((blob) => {
                if (blob) resolve(blob);
                else reject(new Error('Could not encode the photo as JPEG'));
              }, 'image/jpeg', 0.92);
            });
          } finally {
            output.width = 0;
            output.height = 0;
          }
        }

        function photoFileName() {
          const tracked = [...activeTargets].reverse().find((index) => modelPaths[index]);
          const model = tracked !== undefined
            ? modelPaths[tracked].split('/').pop().replace(/_optimizados?\.glb$/, '').replace(/\.glb$/, '')
            : 'foto';
          const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
          return `AR_${model}_${stamp}.jpg`;
        }

        function showPhotoPreview(blob, fileName) {
          previewBlob = blob;
          previewFileName = fileName;
          previewUrl = URL.createObjectURL(blob);
          document.getElementById('photo-preview-image').src = previewUrl;
          document.getElementById('photo-preview').hidden = false;
        }

        function clearPhotoPreview() {
          document.getElementById('photo-preview').hidden = true;
          document.getElementById('photo-preview-image').removeAttribute('src');
          if (previewUrl) URL.revokeObjectURL(previewUrl);
          previewUrl = null;
          previewBlob = null;
          previewFileName = null;
          document.getElementById('save-photo-button').disabled = false;
          captureButton.disabled = false;
        }

        function downloadBlob(blob, fileName) {
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        async function savePhoto(blob, fileName) {
          const file = new File([blob], fileName, { type: blob.type });
          // On mobile the share sheet lets the user save straight to the photo gallery.
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({ files: [file] });
              return 'saved';
            } catch (error) {
              if (error.name === 'AbortError') return 'cancelled';
            }
          }
          downloadBlob(blob, fileName);
          return 'saved';
        }

        const captureButton = document.getElementById('capture-button');
        const captureFlash = document.getElementById('capture-flash');
        const torchButton = document.getElementById('torch-button');
        const savePhotoButton = document.getElementById('save-photo-button');
        const discardPhotoButton = document.getElementById('discard-photo-button');
        let cameraTrack = null;
        let torchSupported = false;
        let torchEnabled = false;
        let torchBusy = false;

        function updateTorchButton() {
          torchButton.disabled = !torchSupported || torchBusy;
          torchButton.setAttribute('aria-pressed', String(torchEnabled));
          torchButton.setAttribute(
            'aria-label',
            torchSupported
              ? `Flash de cámara ${torchEnabled ? 'encendido' : 'apagado'}`
              : 'Flash de cámara no disponible'
          );
        }

        function initializeTorch() {
          const video = scene.systems['mindar-image-system']?.video || document.querySelector('video');
          cameraTrack = video?.srcObject?.getVideoTracks()[0] || null;
          if (!cameraTrack || typeof cameraTrack.getCapabilities !== 'function') {
            updateTorchButton();
            return;
          }

          try {
            torchSupported = cameraTrack.getCapabilities().torch === true;
          } catch (error) {
            console.warn('[Torch] Could not inspect camera capabilities', error);
            torchSupported = false;
          }
          updateTorchButton();
        }

        torchButton.addEventListener('click', async () => {
          if (!torchSupported || !cameraTrack || torchBusy) return;
          torchBusy = true;
          updateTorchButton();
          try {
            await cameraTrack.applyConstraints({ advanced: [{ torch: !torchEnabled }] });
            torchEnabled = !torchEnabled;
          } catch (error) {
            console.warn('[Torch] Camera rejected the torch setting', error);
            torchSupported = false;
            torchEnabled = false;
          } finally {
            torchBusy = false;
            updateTorchButton();
          }
        });

        captureButton.addEventListener('click', async () => {
          if (!scene.renderer) return;
          captureButton.disabled = true;
          captureFlash.classList.add('active');
          requestAnimationFrame(() => captureFlash.classList.remove('active'));
          try {
            const fileName = photoFileName();
            const blob = await capturePhoto();
            showPhotoPreview(blob, fileName);
          } catch (error) {
            console.error('[Capture] Failed to take photo', error);
            captureButton.disabled = false;
          }
        });

        savePhotoButton.addEventListener('click', async () => {
          if (!previewBlob || !previewFileName) return;
          savePhotoButton.disabled = true;
          try {
            const result = await savePhoto(previewBlob, previewFileName);
            if (result === 'saved') clearPhotoPreview();
            else savePhotoButton.disabled = false;
          } catch (error) {
            console.error('[Capture] Failed to save photo', error);
            savePhotoButton.disabled = false;
          }
        });

        discardPhotoButton.addEventListener('click', () => {
          clearPhotoPreview();
        });

        scene.addEventListener('arReady', initializeTorch, { once: true });
        if (scene.hasLoaded) initializeTargetEvents();
        else scene.addEventListener('loaded', initializeTargetEvents, { once: true });
      })();
    </script>
  </body>
</html>
